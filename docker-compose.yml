services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting containers}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DATABASE_URL: postgresql+psycopg://yunsync:yunsync@postgres:5432/yunsync
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yunsync
      POSTGRES_USER: yunsync
      POSTGRES_PASSWORD: yunsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunsync -d yunsync"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
