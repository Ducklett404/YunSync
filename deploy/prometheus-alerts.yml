groups:
  - name: yunsync-availability
    interval: 30s
    rules:
      - alert: YunSyncTargetDown
        expr: up{job="yunsync"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: YunSync 监控目标不可达
          runbook: docs/INCIDENT_RESPONSE_RUNBOOK.md

      - alert: YunSyncHighErrorRate
        expr: |
          sum(rate(yunsync_http_requests_total{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(yunsync_http_requests_total[5m])), 0.001)
          > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: YunSync 五分钟错误率超过 2%
          runbook: docs/INCIDENT_RESPONSE_RUNBOOK.md

      - alert: YunSyncHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(yunsync_http_request_duration_ms_bucket[5m]))
          ) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: YunSync 普通请求 P95 延迟持续超过 500 ms
          runbook: docs/DEPLOYMENT_SECURITY_RUNBOOK.md

      - alert: YunSyncRateLimitSpike
        expr: rate(yunsync_http_events_total{event="rate_limited"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: YunSync 限流事件持续增长
          runbook: docs/DEPLOYMENT_SECURITY_RUNBOOK.md
