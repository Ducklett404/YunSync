name: yunsync-orangepi

x-proxy-address: &proxy-address "${YUNSYNC_BOARD_PROXY_IP:-172.30.84.2}"

x-board-service: &board-service
  platform: linux/arm64
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *board-service
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yunsync
      POSTGRES_USER: yunsync_app
      POSTGRES_PASSWORD: ${YUNSYNC_BOARD_DB_PASSWORD:?Run bash deploy/orangepi/board.sh init first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "yunsync_app", "-d", "yunsync"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    <<: *board-service
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "${YUNSYNC_BOARD_REDIS_APPENDONLY:-no}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *board-service
    image: yunsync-orangepi-api:local
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -ec
      - |
        python -m scripts.wait_for_database
        alembic upgrade head
        python -m scripts.seed_demo
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      FORWARDED_ALLOW_IPS: *proxy-address
      YUNSYNC_APP_ENV: development
      YUNSYNC_DATABASE_URL: postgresql+psycopg://yunsync_app:${YUNSYNC_BOARD_DB_PASSWORD:?Initialize the board environment}@postgres:5432/yunsync?connect_timeout=3
      YUNSYNC_REDIS_URL: redis://redis:6379/0
      YUNSYNC_ALLOW_DEMO_CONTENT: "true"
      YUNSYNC_SEED_DEMO_CONTENT: "false"
      YUNSYNC_CORS_ORIGINS: ""
      YUNSYNC_WEATHER_API_URL: ${YUNSYNC_WEATHER_API_URL:-}
      YUNSYNC_WEATHER_API_KEY: ${YUNSYNC_WEATHER_API_KEY:-}
      YUNSYNC_MAAS_API_URL: ${YUNSYNC_MAAS_API_URL:-}
      YUNSYNC_MAAS_API_KEY: ${YUNSYNC_MAAS_API_KEY:-}
      YUNSYNC_MAAS_MODEL: ${YUNSYNC_MAAS_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      proxy:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          h = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4));
          assert h['dependencies']['database']['status'] == 'ok';
          assert h['dependencies']['cache']['status'] == 'ok'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    <<: *board-service
    image: yunsync-orangepi-web:local
    build:
      context: ../..
      dockerfile: deploy/orangepi/Dockerfile.web
    ports:
      - "${YUNSYNC_BOARD_HTTP_PORT:-8080}:80"
    networks:
      proxy:
        ipv4_address: *proxy-address
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
  redis-data:

networks:
  proxy:
    ipam:
      config:
        - subnet: ${YUNSYNC_BOARD_PROXY_SUBNET:-172.30.84.0/24}
          ip_range: ${YUNSYNC_BOARD_PROXY_DYNAMIC_RANGE:-172.30.84.128/25}
