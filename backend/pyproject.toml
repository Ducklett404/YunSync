[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yunsync-cloud-api"
version = "0.13.0"
description = "YunSync cloud API with controlled MaaS assistance"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "redis==6.4.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
