services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting containers}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-500}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-10000}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://yunsync:yunsync@postgres:5432/yunsync}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-yunsync}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CACHE_CONNECT_TIMEOUT_SECONDS: ${CACHE_CONNECT_TIMEOUT_SECONDS:-0.3}
      CACHE_SOCKET_TIMEOUT_SECONDS: ${CACHE_SOCKET_TIMEOUT_SECONDS:-0.5}
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      USE_LOCAL_STORAGE: ${USE_LOCAL_STORAGE:-true}
      UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR:-/app/uploads}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-8}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-2}
      MAAS_TIMEOUT_SECONDS: ${MAAS_TIMEOUT_SECONDS:-8}
      HUAWEI_REGION: ${HUAWEI_REGION:-cn-north-4}
      HUAWEI_CREDENTIAL_MODE: ${HUAWEI_CREDENTIAL_MODE:-environment}
      HUAWEI_PROJECT_ID: ${HUAWEI_PROJECT_ID:-}
      HUAWEI_ACCESS_KEY: ${HUAWEI_ACCESS_KEY:-}
      HUAWEI_SECRET_KEY: ${HUAWEI_SECRET_KEY:-}
      HUAWEI_OCR_ENDPOINT: ${HUAWEI_OCR_ENDPOINT:-}
      HUAWEI_MAAS_ENDPOINT: ${HUAWEI_MAAS_ENDPOINT:-}
      HUAWEI_MAAS_API_KEY: ${HUAWEI_MAAS_API_KEY:-}
      HUAWEI_OBS_BUCKET: ${HUAWEI_OBS_BUCKET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

  migrate:
    build: .
    command:
      - sh
      - -c
      - |
        if [ -n "$${MIGRATION_DATABASE_URL:-}" ]; then
          export DATABASE_URL="$${MIGRATION_DATABASE_URL}"
        fi
        exec python -m alembic upgrade head
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://yunsync:yunsync@postgres:5432/yunsync}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_DEMO_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yunsync
      POSTGRES_USER: yunsync
      POSTGRES_PASSWORD: yunsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunsync -d yunsync"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
