<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123d35" />
    <meta
      name="description"
      content="云循 V3 M0 可点击原型：今日食养、现有食材与个人档案。"
    />
    <title>云循 · M0 可点击原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <aside class="prototype-panel" aria-label="原型场景切换">
        <div class="brand-lockup">
          <span class="brand-seal" aria-hidden="true">循</span>
          <div>
            <p class="eyebrow">YUNXUN · M0</p>
            <h1>今天，好好吃饭</h1>
          </div>
        </div>
        <p class="panel-intro">选择计划书规定的场景，验证用户能否在 30 秒内找到答案。</p>

        <div class="scenario-list" role="group" aria-label="验收场景">
          <button class="scenario-button is-active" data-scenario="laba" type="button">
            <span class="scenario-index">01</span>
            <span><strong>腊八节</strong><small>节日内容与安全替换</small></span>
          </button>
          <button class="scenario-button" data-scenario="chill" type="button">
            <span class="scenario-index">02</span>
            <span><strong>轻微着凉</strong><small>体感选择与谨慎文案</small></span>
          </button>
          <button class="scenario-button" data-scenario="pantry" type="button">
            <span class="scenario-index">03</span>
            <span><strong>现有食材</strong><small>鸡蛋、西红柿、豆腐</small></span>
          </button>
        </div>

        <div class="test-note">
          <span class="test-note-icon" aria-hidden="true">30</span>
          <p><strong>测试目标</strong><br />不解释界面，让参与者分别找出“今天吃什么”和“现有食材做什么”。</p>
        </div>
      </aside>

      <section class="device-stage" aria-label="移动端原型">
        <div class="phone-frame">
          <div class="phone-speaker" aria-hidden="true"></div>
          <div class="app" id="app">
            <header class="app-header">
              <div>
                <p class="lunar-date" id="lunarDate">腊月初八 · 周三</p>
                <p class="weather-line" id="weatherLine">4℃ 晴 · 偏冷 · 腊八节</p>
              </div>
              <button class="city-button" id="cityButton" type="button" aria-label="选择城市">
                <span id="cityName">杭州</span><span aria-hidden="true">⌄</span>
              </button>
            </header>

            <div class="app-content" id="appContent" aria-live="polite"></div>

            <nav class="bottom-nav" aria-label="主要导航">
              <button class="nav-item is-active" data-page="today" type="button">
                <span class="nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M5 9.5h14M8 4v3m8-3v3M6.5 6h11A1.5 1.5 0 0 1 19 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-11A1.5 1.5 0 0 1 6.5 6Z"/></svg>
                </span>
                <span>今日</span>
              </button>
              <button class="nav-item" data-page="pantry" type="button">
                <span class="nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 4h10l2 4v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8l2-4Zm-2 4h14M9 12h6"/></svg>
                </span>
                <span>食材</span>
              </button>
              <button class="nav-item" data-page="profile" type="button">
                <span class="nav-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0"/></svg>
                </span>
                <span>我的</span>
              </button>
            </nav>
          </div>
        </div>
      </section>
    </main>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <section class="recipe-sheet" id="recipeSheet" aria-modal="true" role="dialog" aria-labelledby="recipeTitle" hidden>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭食谱详情">×</button>
      <div class="sheet-scroll" id="sheetContent"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
